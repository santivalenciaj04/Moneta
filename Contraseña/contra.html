<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
 

  <title>Crea tu contraseña - Moneta</title>
  <link rel="stylesheet" href="pass.css">
</head>
<body>

  <!-- Contenedor Principal -->
  <main class="main-container">

    <!-- Logo Moneta -->
     <div class="fondo">
   

    <h1 class="title">Crea tu contraseña</h1>

    <h3 class="text_logo">Es tu primer ingreso. Elige una contraseña segura.</h3>

       <!-- Formulario con validación nativa HTML5 -->
    <form class="password-form" id="passwordForm">
      
      <!-- Cuadro de Requisitos de Contraseña -->
      <div class="requirements-card">
        <ul class="requirements-list">
          <li class="requirement-item" id="req-length">
            <span class="check-icon">✓</span>
            <span>Mínimo 8 caracteres</span>
          </li>
          <li class="requirement-item" id="req-uppercase">
            <span class="check-icon">✓</span>
            <span>Una letra mayúscula (A-Z)</span>
          </li>
          <li class="requirement-item" id="req-lowercase">
            <span class="check-icon">✓</span>
            <span>Una letra minúscula (a-z)</span>
          </li>
          <li class="requirement-item" id="req-number">
            <span class="check-icon">✓</span>
            <span>Al menos un número (0-9)</span>
          </li>
          <li class="requirement-item special-char-item" id="req-special">
            <div class="special-char-label">
              <span class="check-icon">✓</span>
              <span>Un carácter especial:</span>
            </div>
            <div class="special-char-box">
              ! @ # $ % & * ?
            </div>
          </li>
        </ul>
      </div>

      <!-- Campo 1: Escribe tu contraseña -->
       <label class="form_label"for="password">Contraseña</label>
      <div class="input-group input-wrapper">
        <input type="checkbox" id="toggle-pass1" class="toggle-checkbox">
        
        
        <input 
          type="password" 
          name="password" 
          class="input-password"
          placeholder="Escribe tu contraseña"
          minlength="8"
          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*()_+\-=\[\]{};':&quot;\\|,.<>\/?]).{8,}"
          required
        >
        
        <input 
          type="text" 
          class="input-text"
          placeholder="Escribe tu contraseña"
          minlength="8"
          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*()_+\-=\[\]{};':&quot;\\|,.<>\/?]).{8,}"
        >

        <label for="toggle-pass1" class="toggle-label" aria-label="Mostrar u ocultar contraseña">
          <svg class="eye-icon eye-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="eye-icon eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </label>
      </div>

      <!-- Campo 2: Repite tu contraseña -->
        <label class="form_label" for="confirm-password">Confirmar contraseña</label>
      <div class="input-group input-wrapper">
        <input type="checkbox" id="toggle-pass2" class="toggle-checkbox">

        <input 
          type="password" 
          name="confirmPassword" 
          class="input-password"
          placeholder="Repite tu contraseña"
          minlength="8"
          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*()_+\-=\[\]{};':&quot;\\|,.<>\/?]).{8,}"
          required
        >

        <input 
          type="text" 
          class="input-text"
          placeholder="Repite tu contraseña"
          minlength="8"
          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*()_+\-=\[\]{};':&quot;\\|,.<>\/?]).{8,}"
        >

        <label for="toggle-pass2" class="toggle-label" aria-label="Mostrar u ocultar contraseña">
          <svg class="eye-icon eye-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="eye-icon eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </label>
      </div>

      <!-- Botón de Envío -->
      <button type="submit" id="submitBtn" class="submit-btn">Guardar contraseña</button>
       <button type="button" class="bt2" onclick="window.location.href='../otp/codigo_otp.html'">Avanzar</button>
    </form>
    </div>
  </main>

  <footer class="footer"></footer>

</body>
</html>
