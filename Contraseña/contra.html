<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crea tu contraseña - Moneta</title>
  <link rel="stylesheet" href="pass.css">
</head>
<body>

  <!-- Encabezado / Logo Moneta -->
  <header class="header">
    <div class="logo-container">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="6" fill="#1d2b53"/>
          <path d="M7 9L12 13L17 9V15H7V9Z" fill="#10b981"/>
        </svg>
      </div>
      <span class="logo-text">Moneta</span>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="main-container">
    <h1 class="title">Crea tu contraseña</h1>

    <form class="password-form" id="passwordForm" onsubmit="handleSubmit(event)">
      
      <!-- Cuadro de Requisitos de Contraseña -->
      <div class="requirements-card">
        <ul class="requirements-list">
          <li class="requirement-item invalid" id="req-length">
            <span class="check-icon">✓</span>
            <span>Mínimo 8 caracteres</span>
          </li>
          <li class="requirement-item invalid" id="req-uppercase">
            <span class="check-icon">✓</span>
            <span>Una letra mayúscula (A-Z)</span>
          </li>
          <li class="requirement-item invalid" id="req-lowercase">
            <span class="check-icon">✓</span>
            <span>Una letra minúscula (a-z)</span>
          </li>
          <li class="requirement-item invalid" id="req-number">
            <span class="check-icon">✓</span>
            <span>Al menos un número (0-9)</span>
          </li>
          <li class="requirement-item invalid special-char-item" id="req-special">
            <div class="special-char-label">
              <span class="check-icon">✓</span>
              <span>Un carácter especial:</span>
            </div>
            <div class="special-char-box">
              ! @ # $ % & * ?
            </div>
          </li>
        </ul>
      </div>

      <!-- Campo 1: Escribe tu contraseña -->
      <div class="input-group">
        <input 
          type="password" 
          id="password" 
          placeholder="Escribe tu contraseña"
          oninput="validatePassword()"
          required
        >
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)" aria-label="Mostrar u ocultar contraseña">
          <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <!-- Campo 2: Repite tu contraseña -->
      <div class="input-group">
        <input 
          type="password" 
          id="confirmPassword" 
          placeholder="Repite tu contraseña"
          oninput="validatePassword()"
          required
        >
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="Mostrar u ocultar contraseña">
          <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <!-- Mensaje de error / coincidencia -->
      <div id="match-error" class="error-message" style="display: none;">Las contraseñas no coinciden</div>

      <!-- Botón de Envío -->
      <button type="submit" id="submitBtn" class="submit-btn" disabled>Guardar contraseña</button>

    </form>
  </main>

  <footer class="footer"></footer>

  <script>
    // Mostrar u Ocultar la contraseña con el ojo
    function togglePasswordVisibility(inputId, button) {
      const input = document.getElementById(inputId);
      const isPassword = input.type === 'password';
      
      input.type = isPassword ? 'text' : 'password';

      if (isPassword) {
        button.innerHTML = `
          <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>`;
      } else {
        button.innerHTML = `
          <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>`;
      }
    }

    // Validación de requerimientos
    function validatePassword() {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn = document.getElementById('submitBtn');
      const matchError = document.getElementById('match-error');

      const hasMinLength = password.length >= 8;
      const hasUppercase = /[A-Z]/.test(password);
      const hasLowercase = /[a-z]/.test(password);
      const hasNumber = /[0-9]/.test(password);
      const hasSpecial = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password);

      updateRequirement('req-length', hasMinLength);
      updateRequirement('req-uppercase', hasUppercase);
      updateRequirement('req-lowercase', hasLowercase);
      updateRequirement('req-number', hasNumber);
      updateRequirement('req-special', hasSpecial);

      const passwordsMatch = password !== '' && password === confirmPassword;

      if (confirmPassword.length > 0 && !passwordsMatch) {
        matchError.style.display = 'block';
      } else {
        matchError.style.display = 'none';
      }

      const isAllValid = hasMinLength && hasUppercase && hasLowercase && hasNumber && hasSpecial && passwordsMatch;
      submitBtn.disabled = !isAllValid;
    }

    function updateRequirement(elementId, isValid) {
      const element = document.getElementById(elementId);
      if (isValid) {
        element.classList.remove('invalid');
        element.classList.add('valid');
      } else {
        element.classList.remove('valid');
        element.classList.add('invalid');
      }
    }

    function handleSubmit(e) {
      e.preventDefault();
      alert('¡Contraseña guardada con éxito!');
    }
  </script>
</body>
</html>
